plugins {
    id 'java'
    id "net.serenity-bdd.serenity-gradle-plugin" version "4.0.46"
}

group = 'org.bhanu'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    serenityVersion    = '4.0.46'
    restAssuredVersion = '5.4.0'
    jacksonVersion     = '2.17.2'
}

dependencies {
    implementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-rest-assured:${serenityVersion}"

    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.2")
    testImplementation 'io.cucumber:cucumber-junit:7.14.0'

    // Confluence Agent — Jackson for JSON parsing
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
}

test {
    // Do NOT use useJUnitPlatform()
    systemProperty "file.encoding", "utf-8"
    testLogging.showStandardStreams = true
    finalizedBy(aggregate)
}

// ── Confluence Agent ──────────────────────────────────────────────────────────
// Run with:  ./gradlew runConfluenceAgent --args="list"
//            ./gradlew runConfluenceAgent --args="read --title \"My Page\""
//            ./gradlew runConfluenceAgent --args="create --title \"T\" --body \"B\""
// ─────────────────────────────────────────────────────────────────────────────
tasks.register('runConfluenceAgent', JavaExec) {
    group       = 'confluence'
    description = 'Run the ConfluenceReader agent CLI (pass --args="<command> [options]")'
    classpath   = sourceSets.main.runtimeClasspath
    mainClass   = 'com.bhanu.agents.ConfluenceAgent'
}

